<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIPPON SHIPMENT TRACKING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mali:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#0a2a5e; --navy-2:#13408a; --blue:#1565c0; --blue-2:#1e88e5; --sky:#e6f1fc; --sky-2:#f3f8fe; --sky-3:#d6e8fa;
  --green:#22a05a; --green-soft:#e2f5ea; --amber:#e8890c; --amber-soft:#fff1dc; --orange:#f26b1d; --orange-soft:#ffe9dc;
  --red:#e0383e; --red-soft:#fde6e7; --slate:#5d6f88; --slate-soft:#edf1f6; --purple:#6f4fd8;
  --line:#d7e4f2; --ink:#10223f; --muted:#5f6f86; --white:#fff;
  --radius:18px; --shadow:0 4px 18px rgba(10,42,94,.08); --shadow-2:0 10px 30px rgba(10,42,94,.12);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.55;color:var(--ink);
  background:linear-gradient(180deg,#dcecfb 0%,#eef6fe 220px,#f5f9fe 100%) fixed}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
.hidden{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;white-space:nowrap}
.btn-primary{background:linear-gradient(180deg,#1e7be0,#1565c0);color:#fff;box-shadow:0 4px 12px rgba(21,101,192,.25)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-green{background:linear-gradient(180deg,#2db769,#22a05a);color:#fff;box-shadow:0 4px 12px rgba(34,160,90,.25)}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}
.btn-danger.solid{background:var(--red);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--navy)}
.btn-ghost:hover{background:var(--sky)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-sm{min-height:38px;padding:0 14px;font-size:15px;border-radius:10px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:4px 6px;font-size:15.5px;text-decoration:underline}
label.field{display:block;margin-bottom:16px}
label.field>span{display:block;font-weight:600;margin-bottom:6px;color:var(--navy)}
.inp{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea.inp{padding:10px 14px;min-height:70px;resize:vertical}
.inp:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(30,136,229,.15)}
.err{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.ok{background:var(--green-soft);color:#17703f;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.warn{background:var(--amber-soft);color:#8a5200;border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:500}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:20px 22px}
.panel h3,.dcard h3{margin:0 0 14px;font-size:19px;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:10px}
.k{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);display:block}
.small-muted{font-size:14.5px;color:var(--muted)}
.muted-line{color:var(--muted);margin:4px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.empty-big{padding:40px 24px;text-align:center}
.empty-big h2{color:var(--navy);margin:0 0 6px}
.empty-big p{color:var(--muted);margin:0 0 16px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#b9dcfb 0%,#dcedfd 55%,#f5faff 100%);display:flex;flex-direction:column;padding:40px 48px;gap:18px}
.login-hero .brandrow{display:flex;align-items:center;gap:14px}
.login-hero .brandrow img{height:56px;width:auto;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:var(--shadow)}
.login-hero h1{font-size:42px;line-height:1.1;margin:0;color:var(--navy);letter-spacing:.5px}
.login-hero h1 small{display:block;font-size:19px;font-weight:500;color:var(--blue);letter-spacing:0;margin-top:10px}
.login-hero .tag{align-self:flex-start;font-weight:700;color:var(--navy);border-bottom:3px solid var(--green);padding-bottom:2px}
.login-art{position:relative;margin-top:auto;min-height:300px}
.login-art svg{width:100%;height:auto;display:block}
.login-art .mascot{position:absolute;left:0;bottom:0;height:88%;max-height:380px;width:auto;filter:drop-shadow(0 8px 18px rgba(10,42,94,.18))}
.login-side{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.login-card{width:100%;max-width:430px}
.login-card h2{margin:0 0 6px;color:var(--navy);font-size:30px}
.login-card p.sub{margin:0 0 22px;color:var(--muted)}
.tabs{display:flex;background:var(--sky);border-radius:14px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:transparent;min-height:46px;border-radius:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.credit{color:var(--muted);font-size:14px;margin-top:22px;text-align:center}
.credit b{color:var(--navy)}

/* ---------- pending ---------- */
.center-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.pending{max-width:480px;padding:36px;text-align:center}
.pending .ico{width:76px;height:76px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;margin:0 auto 16px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:286px 1fr;min-height:100vh}
.side{margin:14px 0 14px 14px;border-radius:24px;background:linear-gradient(180deg,#0d3270 0%,#0a2a5e 55%,#08224c 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px);box-shadow:var(--shadow-2);overflow:hidden}
.brand{margin:14px;background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--navy)}
.brand img{max-height:52px;max-width:100%;width:auto;display:block}
.brand.has-logo{flex-direction:column;align-items:flex-start;gap:4px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--sky);display:grid;place-items:center;flex:none}
.brand-txt{line-height:1.15}
.brand-txt b{display:block;font-size:17px;letter-spacing:.6px}
.brand-txt small{font-size:11.5px;color:var(--blue);letter-spacing:1.3px;font-weight:600}
.nav{flex:1;overflow:auto;padding:4px 12px 10px}
.nav a{display:flex;align-items:center;gap:12px;color:#d6e4f7;text-decoration:none;padding:9px 14px;border-radius:13px;margin-bottom:3px;white-space:nowrap}
.nav a svg{flex:none}
.nav a .nl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nav a .nl b,.nav a .nl small{overflow:hidden;text-overflow:ellipsis}
.nav a .nl b{font-weight:600;font-size:15.5px}
.nav a .nl small{font-size:12.5px;color:#9fbbe3}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:linear-gradient(90deg,#1e7be0,#1565c0);color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.nav a.on .nl small{color:#d9e9ff}
.nav .cnt{flex:none;margin-left:auto;background:var(--orange);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:1px 8px}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 6px}
.me{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3d8ae6,#1453a8);display:grid;place-items:center;font-weight:700;flex:none;color:#fff;border:2px solid rgba(255,255,255,.6)}
.avatar.sm{width:36px;height:36px;font-size:15px}
.avatar.lg{width:72px;height:72px;font-size:28px}
.me div{min-width:0;line-height:1.3}
.me b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:#a9c4ea;font-size:13px}
.side-credit{padding:4px 18px 14px;font-size:12px;color:#8fa9cf}
.main{min-width:0}
.topbar{display:none}
.page{padding:14px 22px 60px;max-width:1460px}

/* ---------- page hero (banner) ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:132px;display:flex;align-items:center;gap:18px;padding:18px 24px;margin-bottom:18px;
  background:linear-gradient(115deg,#ffffff 0%,#eef6ff 35%,#cfe5fb 70%,#a9d1f7 100%);border:1px solid #cfe1f5;box-shadow:var(--shadow)}
.hero-sky{position:absolute;inset:0;pointer-events:none}
.hero-sky svg{position:absolute;right:0;top:0;height:100%;width:auto;min-width:60%}
.hero-mascot{position:relative;height:150px;width:auto;margin:-18px 0 -24px -6px;align-self:flex-end;filter:drop-shadow(0 6px 12px rgba(10,42,94,.18))}
.hero-ico{position:relative;width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#1e7be0,#0a2a5e);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(21,101,192,.3)}
.hero-txt{position:relative;min-width:0;flex:1}
.hero-txt h1{margin:0;font-size:30px;line-height:1.15;color:var(--navy);letter-spacing:.3px}
.hero-th{font-size:20px;font-weight:600;color:var(--blue)}
.hero-txt p{margin:6px 0 0;color:var(--muted);font-size:15.5px;max-width:720px}
.hero-right{position:relative;z-index:1;display:flex;align-items:center;gap:12px;align-self:flex-start}
.bell{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);box-shadow:var(--shadow);text-decoration:none}
.bell .bdg{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.uchip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:30px;padding:5px 14px 5px 5px;box-shadow:var(--shadow);line-height:1.2}
.uchip b{font-size:14.5px;color:var(--navy);display:block}
.uchip small{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin:-6px 0 16px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--green);font-weight:600}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* ---------- dashboard ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:30px;min-height:40px;padding:0 16px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips .lab{font-size:13.5px;font-weight:700;color:var(--muted);min-width:70px}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:18px}
.stat{position:relative;padding:16px 14px 14px;border-radius:18px;background:var(--bgc);border:1px solid rgba(0,0,0,.04);text-align:center;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .si{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.stat .lbl{font-size:14px;font-weight:700;color:var(--ink)}
.stat .num{font-size:34px;font-weight:700;color:var(--c);line-height:1.15}
.stat .th{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.wh-row{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.wh-row:last-child{border-bottom:0}
.bar{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--slate-soft)}
.bar i{display:block;height:100%}
.wh-total{font-size:20px;font-weight:700;text-align:right;color:var(--navy)}
.wh-total small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
#trend>svg{width:100%;height:auto;display:block}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--sky)}
.list li:last-child{border-bottom:0}
.list .t{font-size:13.5px;color:var(--muted);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:9px;flex:none}
.grid-mt{margin-top:18px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:30px;font-size:14px;font-weight:700;letter-spacing:.3px;background:var(--bg);color:var(--c);white-space:nowrap}
.s-WAITING{--c:var(--slate);--bg:var(--slate-soft)}
.s-ARRIVED{--c:var(--blue);--bg:var(--sky)}
.s-LOADING{--c:var(--amber);--bg:var(--amber-soft)}
.s-DEPARTED{--c:var(--green);--bg:var(--green-soft)}
.s-ISSUE{--c:var(--red);--bg:var(--red-soft)}
.w-DAC{--c:#fff;--bg:var(--blue)}
.w-BLC{--c:#fff;--bg:var(--green)}
.w-UNASSIGNED{--c:var(--orange);--bg:var(--orange-soft)}
.w-PENDING{--c:var(--amber);--bg:var(--amber-soft)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:14px;color:var(--navy);font-weight:700;padding:11px 12px;background:var(--sky);white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:12px;border-bottom:1px solid var(--sky);vertical-align:middle;overflow-wrap:anywhere}
.tbl tr.pend td{background:#fffaf0}
.tbl tr.gone td{color:#9aa7b8;text-decoration:line-through}
.tbl .inp{min-height:42px}
.tbl select.inp{min-width:140px}
.tbl input.inp{min-width:130px}
.tbl-wrap{overflow-x:auto}
.tbl.small td,.tbl.small th{padding:8px 10px;font-size:15px}
tr.click,li.click{cursor:pointer}
tr.click:hover td{background:var(--sky-2)}

/* ---------- misc ---------- */
.soon-card{padding:44px 28px;text-align:center;max-width:640px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:99;font-weight:500;max-width:90vw}
.toast.bad{background:var(--red)}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn-ghost .spinner,.btn-danger .spinner{border-color:rgba(10,42,94,.2);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- board ---------- */
.controls{padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.stabs{display:flex;gap:8px;flex-wrap:wrap}
.stab{border:0;border-radius:12px;min-height:42px;padding:0 18px;font-weight:700;background:var(--sky);color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stab.on{background:linear-gradient(180deg,#1e7be0,#1565c0);color:#fff;box-shadow:0 4px 12px rgba(21,101,192,.25)}
.search{display:flex;gap:10px}
.inp.big{min-height:56px;font-size:19px}
.flight{margin-bottom:16px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:linear-gradient(90deg,#e3f0fd,#f3f8fe);border-bottom:1px solid var(--line)}
.ftag{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.fcode{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.fetd{font-weight:600;color:var(--blue)}
.fdest{font-weight:600;color:var(--navy)}
.fmeta{color:var(--muted);font-size:14.5px;margin-left:auto}
.mawb+.mawb{border-top:1px solid var(--line)}
.mhead{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.mcode{font-weight:700;font-size:17px;color:var(--navy)}
.mhead .fmeta{margin-left:0}
.cbx{width:26px;height:26px;accent-color:var(--blue);flex:none;cursor:pointer}
.hrow{display:grid;grid-template-columns:40px minmax(0,2.4fr) minmax(0,.8fr) minmax(0,1.3fr) 130px 140px;gap:12px;align-items:center;padding:12px 18px;border-top:1px dashed var(--line);cursor:pointer;min-height:70px}
.hrow:hover,.hrow.sel{background:var(--sky-2)}
.hrow.sel{box-shadow:inset 4px 0 0 var(--blue)}
.hawb{font-weight:700;font-size:17.5px;color:var(--ink);letter-spacing:.02em}
.cust{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-dest,.h-pcs{font-weight:600}
.mbar{height:8px;border-radius:9px;background:var(--slate-soft);overflow:hidden;margin-top:4px}
.mbar.big{height:12px;margin-bottom:14px}
.mbar i{display:block;height:100%;background:var(--green);border-radius:9px}
.actbar{position:fixed;left:316px;right:22px;bottom:14px;z-index:30;background:var(--navy);color:#fff;padding:12px 18px;border-radius:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.actbar .cnt{font-weight:700;font-size:18px;margin-right:auto}
.btn.to-DAC{background:var(--blue);color:#fff}
.btn.to-BLC{background:var(--green);color:#fff}
.btn.to-UN,.btn.to-UNASSIGNED{background:#fff;color:var(--navy)}
.actbar .btn-danger{background:transparent;border-color:#ff9a9e;color:#ffd0d2}
#blist{padding-bottom:100px}

/* ---------- modal & drawer ---------- */
.modal-bg,.drawer-bg{position:fixed;inset:0;background:rgba(6,20,40,.5);z-index:60}
.modal-bg{display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:85vh;overflow:auto;padding:24px}
.modal h3{margin:0 0 10px;color:var(--navy)}
.modal .row-btns{justify-content:flex-end}
.drawer-bg{display:flex;justify-content:flex-end}
.drawer{background:var(--sky-2);width:min(840px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.dhead{position:sticky;top:0;z-index:2;background:linear-gradient(110deg,#fff 40%,#d9ebfc);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle{font-size:26px;font-weight:700;color:var(--navy);word-break:break-all;line-height:1.2}
.dbody{padding:18px 20px 60px;display:flex;flex-direction:column;gap:16px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.note-box{background:var(--amber-soft);color:#7a4c00;border-radius:14px;padding:14px 16px;font-weight:600}
.note-box .row-btns{margin-top:10px}
.steps{display:flex;align-items:flex-start;gap:0;margin:4px 0 18px}
.step{flex:1;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:19px;left:-50%;right:50%;height:4px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before{background:var(--green)}
.step .sc{position:relative;width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#fff;border:3px solid var(--line);color:var(--line);z-index:1}
.step.done .sc{background:var(--green);border-color:var(--green);color:#fff}
.step.cur .sc{box-shadow:0 0 0 5px var(--green-soft)}
.step b{display:block;font-size:14.5px;color:var(--navy)}
.step small{font-size:13px;color:var(--muted)}
.issue-banner{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.stbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stbtn{min-height:68px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:var(--c);font-weight:700;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.stbtn small{font-weight:500;font-size:13px;letter-spacing:0}
.stbtn.on{border-color:var(--c);box-shadow:0 0 0 3px #fff inset;background:var(--c);color:#fff}
.stbtn:disabled{cursor:default;opacity:.75}
.stbtn.on:disabled{opacity:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0 14px;align-items:end}
.prog-line{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:6px;font-size:17px}
.prog-line b{font-size:24px}
.truck{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--sky-2)}
.truck.add{background:var(--sky);border-style:dashed}
.truck-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tno{color:var(--muted);font-size:14px;font-weight:600}
.plate{font-weight:700;font-size:17px;border:2px solid var(--ink);border-radius:6px;padding:2px 10px;background:#fff;letter-spacing:.04em;white-space:nowrap}
input.plate{max-width:150px;min-height:44px}
.pcs-in{display:flex;align-items:center;gap:6px;font-weight:600}
.pcs-in .inp{width:100px;min-height:44px}
.truck .del{margin-left:auto;color:var(--red)}
.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.stamp>span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.sline{display:flex;gap:6px}
.sline .inp{min-height:44px;padding:0 8px;font-size:15px;min-width:0}
.kvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.kv.wide{grid-column:1/-1}
.kv .v{font-weight:600;font-size:16.5px;word-break:break-word}

/* ---------- import ---------- */
.istepper{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.istep{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:6px 16px 6px 6px;font-weight:600;color:var(--muted)}
.istep i{width:30px;height:30px;border-radius:50%;background:var(--slate-soft);display:grid;place-items:center;font-style:normal;font-weight:700}
.istep.on{color:var(--navy);border-color:var(--blue-2)}
.istep.on i{background:var(--blue);color:#fff}
.istep.done i{background:var(--green);color:#fff}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px;border:2.5px dashed var(--blue-2);border-radius:var(--radius);background:#fff;color:var(--navy);text-align:center;cursor:pointer}
.drop b{font-size:21px}
.drop span{color:var(--muted)}
.drop span.btn{color:#fff}
.drop.over{background:var(--sky)}
.xl-ico{width:64px;height:64px;border-radius:14px;background:#1f7a45;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.sheets{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.sheetbox{flex:1 1 220px;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;background:var(--sky-2)}
.sheetbox.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.istats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.istats div{background:var(--sky-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.istats b{display:block;font-size:32px;color:var(--navy);line-height:1.1}
.istats span{color:var(--muted);font-size:14.5px}
details.changes{margin:10px 0;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff}
details.changes summary{cursor:pointer;font-weight:600;color:var(--blue)}

/* ---------- notifications ---------- */
.ncard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--bgc);margin-bottom:10px;text-decoration:none;color:inherit}
.ncard .ni{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ncard b{color:var(--ink)}
.nlist li{align-items:center}
.nlist .ni{width:38px;height:38px;border-radius:50%;background:var(--bgc);color:var(--c);display:grid;place-items:center;flex:none}
.nlist li.unread{background:linear-gradient(90deg,#f0f7ff,transparent);border-radius:10px}
.nlist .udot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none}

/* ---------- settings / branding ---------- */
.profile-card{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.profile-card b{font-size:20px;color:var(--navy);display:block}
.brand-slot{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;margin-bottom:12px;background:var(--sky-2)}
.brand-slot .pv{width:120px;height:90px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line)}
.brand-slot .pv img{max-width:100%;max-height:100%}
.brand-slot .bs-txt{flex:1;min-width:0}

/* ---------- responsive ---------- */
@media (max-width:1300px){.stats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:980px){
  .login-wrap{grid-template-columns:1fr}
  .login-hero{padding:24px 20px 0}
  .login-hero h1{font-size:28px}
  .login-art{min-height:200px}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;margin:0;border-radius:0 22px 22px 0;width:290px;height:100vh;z-index:50;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:40}
  .topbar button{background:transparent;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
  .topbar b{font-size:16px;letter-spacing:.5px;flex:1}
  .topbar .bell{width:40px;height:40px}
  .page{padding:12px 12px 40px}
  .hero{min-height:110px;padding:14px 16px;gap:12px;border-radius:18px}
  .hero-txt h1{font-size:22px}.hero-th{font-size:16px}.hero-txt p{font-size:14px}
  .hero-mascot{height:104px;margin:-14px 0 -18px -8px}
  .hero-ico{width:50px;height:50px;border-radius:14px}
  .hero-right{display:none}
  .hero-sky svg{opacity:.28}
  .toolbar{margin-top:0}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stats .stat:first-child{grid-column:1/-1}
  .stat .num{font-size:28px}
  .wh-row{grid-template-columns:96px 1fr 90px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:6px 4px;background:#fff}
  .tbl td{border:0;padding:6px 10px}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:13px;color:var(--muted);font-weight:600}
  .actbar{left:8px;right:8px;bottom:8px;padding:10px 12px}
  .actbar .cnt{width:100%;font-size:16px}
  .actbar .btn{flex:1;min-width:120px;font-size:15px;padding:0 10px}
  .hrow{grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"c m m" "c d p" "c w s";row-gap:6px;padding:12px 14px}
  .hrow>input,.hrow>span:first-child{grid-area:c;align-self:start}
  .h-main{grid-area:m}.h-dest{grid-area:d}.h-pcs{grid-area:p}.h-wh{grid-area:w}.h-st{grid-area:s;justify-self:end}
  .fhead,.mhead{padding:10px 14px}
  .fmeta{margin-left:0;width:100%}
  .fcode{font-size:20px}
  .stbtns{grid-template-columns:repeat(2,1fr)}
  .stbtns .stbtn:last-child{grid-column:1/-1}
  .grid-2,.grid-3,.stamps{grid-template-columns:1fr}
  .kvgrid{grid-template-columns:1fr 1fr}
  .istats{grid-template-columns:1fr}
  .dhead{padding:12px 14px}.dbody{padding:14px 12px 60px}
  .dtitle{font-size:22px}
  .chips .lab{min-width:100%}
  .step b{font-size:13px}
}

/* =================== v1.1 dashboard like mockup =================== */
.side-title{margin:-2px 18px 10px;font-weight:700;font-size:15.5px;letter-spacing:.6px;line-height:1.25;color:#fff}
.brand.has-logo{justify-content:center;padding:14px}
.brand.has-logo img{max-height:84px}
.side-plane{display:block;width:100%;height:56px;margin-top:-6px}
.hero-sky .banner-img{position:absolute;right:0;top:0;height:100%;width:72%;object-fit:cover;object-position:right center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 35%);mask-image:linear-gradient(90deg,transparent 0,#000 35%)}
.dhero{position:relative;overflow:hidden;border-radius:26px;min-height:236px;padding:30px 30px 56px;display:flex;align-items:flex-start;gap:20px;
  background:linear-gradient(180deg,#bfe0fb 0%,#e3f1fe 70%,#f3f9ff 100%);border:1px solid #cfe1f5;box-shadow:var(--shadow)}
.dhero-bg{position:absolute;inset:0;pointer-events:none}
.dhero-bg svg{position:absolute;right:0;top:0;height:100%;width:auto;min-width:65%}
.dhero-bg img{position:absolute;right:0;top:0;height:100%;width:60%;object-fit:cover;object-position:right center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.dhero-mascot{position:absolute;left:6px;bottom:-4px;height:226px;width:auto;filter:drop-shadow(0 8px 16px rgba(10,42,94,.2))}
.dhero.has-mascot .dhero-txt{margin-left:292px}
.dhero-txt{position:relative;margin-top:6px}
.dhero-txt h1{margin:0;font-size:40px;line-height:1.05;color:var(--navy);letter-spacing:.5px;text-shadow:0 0 12px #fff,0 0 4px #fff}
.dhero-txt{max-width:46%}
#acts td{white-space:nowrap}
.dhero-txt p{margin:10px 0 0;font-weight:700;font-style:italic;color:var(--navy);font-size:18px}
.dhero-right{position:relative;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.datechip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 16px;font-weight:600;color:var(--navy);box-shadow:var(--shadow)}
.dpanel{position:relative;margin:-46px 18px 0;padding:18px 20px 20px;border-radius:22px}
.dpanel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dpanel-head h2{margin:0;font-size:22px;color:var(--navy);display:flex;align-items:center;gap:10px}
.dpanel-head h2 span{font-weight:600;color:var(--blue)}
.dpanel .stats{margin-bottom:0}
.hico{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.grid-act{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.issuecard{position:relative;overflow:hidden;min-height:260px}
.issuecard .ncard{padding:10px 14px;margin-bottom:8px}
.issuecard .ccount{font-size:22px;font-weight:700;color:var(--c);background:#fff;border-radius:20px;padding:0 12px;min-width:46px;text-align:center}
.issuecard .list{padding-right:0}
.issue-mascot{position:absolute;right:8px;bottom:-6px;height:150px;width:auto;opacity:.98;pointer-events:none}
.issuecard:has(.issue-mascot){padding-bottom:150px}
.issuecard .list li{align-items:center}
.issuecard .iline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa h3{display:flex;align-items:center;gap:8px;color:var(--navy);margin:0 0 12px;font-size:20px}
.qa-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.qa-btn{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:.15s}
.qa-btn:hover{transform:translateY(-2px);border-color:var(--blue-2)}
.qa-btn .qi{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1e7be0,#0a2a5e);color:#fff;display:grid;place-items:center;flex:none}
.qa-btn b{display:block;color:var(--navy);font-size:17px}
.qa-btn small{color:var(--muted);font-size:14px}
.tagline{text-align:right;font-family:"Mali","IBM Plex Sans Thai",sans-serif;font-style:italic;font-weight:700;font-size:28px;color:var(--navy);margin:22px 6px 0;transform:rotate(-3deg)}
@media (max-width:1200px){.grid-act{grid-template-columns:1fr}}
@media (max-width:980px){
  .dhero{min-height:170px;padding:18px 16px 50px;flex-direction:column;gap:10px}
  .dhero-bg svg,.dhero-bg img{opacity:.35}
  .dhero-mascot{height:150px;left:auto;right:-6px;bottom:30px;opacity:.95}
  .dhero.has-mascot .dhero-txt{margin-left:0;margin-right:110px}
  .dhero-txt h1{font-size:25px}.dhero-txt p{font-size:14px}
  .dhero-right{margin-left:0;align-items:flex-start}
  .dhero-right .bell,.dhero-right .uchip{display:none}
  .dpanel{margin:-40px 6px 0;padding:14px}
  .dpanel-head h2{font-size:18px}
  .tagline{font-size:20px}
  .issue-mascot{height:110px}
  .issuecard:has(.issue-mascot){padding-bottom:110px}
}

/* ---------- v1.5: ตั๋ว · เพิ่มเอง · ทำหลาย HAWB ---------- */
div.field{display:block;margin-bottom:16px}
div.field>span{display:block;font-weight:600;margin-bottom:6px;color:var(--navy)}
.tk-ISSUED{--c:#fff;--bg:var(--green)}
.tk-NOT_ISSUED{--c:var(--purple);--bg:#efeafd}
.tag-man{--c:var(--orange);--bg:var(--orange-soft);min-height:22px;font-size:12.5px;padding:0 9px;vertical-align:middle}
.h-st{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.h-st .badge.tk-ISSUED,.h-st .badge.tk-NOT_ISSUED{min-height:22px;font-size:12.5px;padding:0 9px}
.btn.bulk{background:#fff;color:var(--navy)}
.btn.bulk.btn-primary{background:var(--blue-2);color:#fff;border-color:transparent}
.btn.tk-on{background:var(--green);color:#fff;border-color:transparent}
.actbar .btn.tk-off{background:transparent;border-color:#c9b8ff;color:#e6deff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bulk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.bulk-sum div{background:var(--sky);border-radius:14px;padding:12px;text-align:center}
.bulk-sum b{display:block;font-size:26px;color:var(--navy);line-height:1.2}
.bulk-sum span{font-size:13.5px;color:var(--muted)}
.modal{width:min(640px,100%)}
.modal .stbtns{grid-template-columns:repeat(3,1fr)}
.tkcard{border-left:5px solid var(--purple)}
.tkcard.on{border-left-color:var(--green)}
.tkline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tkform{display:flex;gap:10px;margin-top:12px}
.tkform .inp{flex:1;min-height:42px}
@media (max-width:900px){
  .bulk-sum b{font-size:22px}
  .tkform{flex-direction:column}
  .h-st{align-items:flex-end}
}
.modal>.row-btns{position:sticky;bottom:-24px;background:#fff;margin:0 -24px -24px;padding:12px 24px 16px;border-top:1px solid var(--line)}
</style>

    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
  }
  function unzip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('NOT_XLSX');
    const n = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const files = {};
    const dec = new TextDecoder();
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
      const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
      const data = u8.subarray(start, start + csize);
      files[name] = async () => dec.decode(method === 0 ? data : await inflate(data));
      p += 46 + nl + el + cl;
    }
    return files;
  }
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const all = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
  function colIdx(ref) { let c = 0; for (const ch of ref) { const k = ch.charCodeAt(0); if (k < 65 || k > 90) break; c = c * 26 + (k - 64); } return c - 1; }

  // returns [{name, rows: [[cell,...],...]}]  (max 40 columns)
  async function read(buf, maxCols = 40) {
    const z = unzip(buf);
    const get = async n => (z[n] ? z[n]() : null);
    const wbx = await get('xl/workbook.xml');
    if (!wbx) throw new Error('NOT_XLSX');
    const rels = {};
    all(xml(await get('xl/_rels/workbook.xml.rels') || '<x/>'), 'Relationship').forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));
    const ss = [];
    const ssx = await get('xl/sharedStrings.xml');
    if (ssx) all(xml(ssx), 'si').forEach(si => ss.push(all(si, 't').filter(t => t.parentNode.localName !== 'rPh').map(t => t.textContent).join('')));
    const out = [];
    for (const sh of all(xml(wbx), 'sheet')) {
      const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels[rid] || '';
      target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
      const sx = await get(target);
      if (!sx) continue;
      const rows = [];
      for (const row of all(xml(sx), 'row')) {
        const ri = parseInt(row.getAttribute('r'), 10) - 1;
        const arr = [];
        let ci = -1;
        for (const c of all(row, 'c')) {
          const ref = c.getAttribute('r');
          ci = ref ? colIdx(ref) : ci + 1;
          if (ci >= maxCols) continue;
          const t = c.getAttribute('t'), vEl = all(c, 'v')[0];
          let v = vEl ? vEl.textContent : null;
          if (t === 's') v = ss[parseInt(v, 10)] ?? '';
          else if (t === 'inlineStr') v = all(c, 't').map(x => x.textContent).join('');
          else if (t === 'b') v = v === '1';
          else if (t === 'str' || t === 'e') v = v ?? '';
          else if (v !== null && v !== '') v = Number(v);
          if (v !== null && v !== '') arr[ci] = v;
        }
        rows[ri] = arr;
      }
      out.push({ name: sh.getAttribute('name'), rows });
    }
    return out;
  }
  return { read };
})();

/* =====================================================================
   PLANLOAD parser (AIR EXPORT CONSIGNMENT DAILY PLANLOAD)
   Header row has: SHIPPER | CGO P/U | TIME | PCS | PRIO | G/W [KGS] | VL.WT. | CBM |
                   HAWB NO. | MAWB.NO. | FLT NO. | ETD | DEST | BKG | Cut-off | Branch | O/B | REMARK
   Consolidations: MAWB / FLT / ETD written only on the first HAWB of a block → fill down
   until a non-HAWB row (blank, ratio or TOTAL row).
   ===================================================================== */
const PLAN = (() => {
  const H = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9ก-๙]/g, '');
  const COLS = [
    ['customer', h => /^(SHIPPER|CUSTOMER|CONSIGNOR)/.test(h)],
    ['pu_date',  h => /^(CGOPU|PU|PICKUP|CARGOPU)/.test(h)],
    ['pu_time',  h => h === 'TIME' || h === 'PUTIME'],
    ['pcs',      h => /^(PCS|PIECES|PKGS?)$/.test(h)],
    ['priority', h => /^PRIO/.test(h)],
    ['gw',       h => /^(GW|GROSS)/.test(h)],
    ['vw',       h => /^(VLWT|VOLWT|VW|VOLUME)/.test(h)],
    ['cbm',      h => h === 'CBM'],
    ['hawb',     h => /^(HAWB|HOUSE)/.test(h)],
    ['mawb',     h => /^(MAWB|MASTER)/.test(h)],
    ['flight',   h => /^(FLT|FLIGHT)/.test(h)],
    ['etd',      h => h === 'ETD'],
    ['dest',     h => /^(DEST|DST)/.test(h)],
    ['booking',  h => /^(BKG|BOOKING)/.test(h)],
    ['cutoff',   h => /^CUTOFF/.test(h)],
    ['ob',       h => h === 'OB'],
    ['remark',   h => /^REMARK/.test(h)]
  ];
  const REQUIRED = ['hawb', 'mawb', 'flight', 'pcs'];
  const MON = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  const pad = n => String(n).padStart(2, '0');
  const str = v => (v === null || v === undefined) ? '' : String(v).replace(/\s+/g, ' ').trim();

  function sheetTag(name) {
    const u = name.toUpperCase();
    if (u.includes('DMK')) return 'DMK';
    if (u.includes('BKK') || u.includes('SUVARN')) return 'BKK-SUVARNABHUMI';
    return null;
  }
  function dateFromFileName(fn) {
    const m = String(fn).toUpperCase().match(/(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*[\s_.\-]*(\d{1,2})[\s_.,\-]*(\d{4})/);
    if (!m) return null;
    const y = +m[3], mo = MON[m[1]], d = +m[2];
    return d >= 1 && d <= 31 ? `${y}-${pad(mo)}-${pad(d)}` : null;
  }
  function hawbId(v) {
    if (typeof v === 'number') return Number.isInteger(v) && v >= 1e7 ? String(v) : null;
    const s = str(v).toUpperCase();
    if (!s) return null;
    if (s === 'DIRECT') return 'DIRECT';
    const k = s.replace(/\s+/g, '').replace(/[.,]+$/, '');
    let m = k.match(/^([A-Z]{2,5})-?(\d{4})(\d{4})$/);
    if (m) return `${m[1]}-${m[2]} ${m[3]}`;
    if (/^[A-Z]{2,5}-?\d{6,}$/.test(k) || /^\d{8,}$/.test(k)) return k;
    return null;
  }
  function mawbOf(v) {
    const s = str(v);
    const m = s.match(/^(\d{3})\s*-?\s*(\d{3,4})\s*(\d{4})$/);
    return m ? `${m[1]}-${m[2]} ${m[3]}` : null;
  }
  function flightOf(v) {
    const s = str(v).toUpperCase();
    return /^[A-Z0-9]{2}(\/[A-Z0-9]{2})?\s?\d{1,4}[A-Z]?\s*\/\s*\d{1,3}$/.test(s) ? s.replace(/\s+/g, '') : null;
  }
  function timeOf(v) {
    let h, m;
    if (typeof v === 'number') { if (v < 0 || v >= 24) return null; h = Math.floor(v); m = Math.round((v - h) * 100); }
    else {
      const s = str(v).replace(/^'/, '');
      const x = s.match(/^(\d{1,2})(?:[.:](\d{1,2}))?$/);
      if (!x) return null;
      h = +x[1]; m = x[2] ? +(x[2].length === 1 ? x[2] + '0' : x[2]) : 0;
    }
    return h < 24 && m < 60 ? `${pad(h)}:${pad(m)}` : null;
  }
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const n = parseFloat(str(v).replace(/,/g, ''));
    return isFinite(n) ? n : null;
  }
  function etdIso(flight, time, planDate) {
    if (!time || !planDate) return null;
    let [y, mo, pd] = planDate.split('-').map(Number);
    let d = pd;
    const fm = flight && flight.match(/\/(\d{1,2})$/);
    if (fm && +fm[1] >= 1 && +fm[1] <= 31) {
      d = +fm[1];
      if (d < pd - 10) mo += 1;   // แพลนเป็นงานล่วงหน้า: วันที่น้อยกว่ามาก = เดือนถัดไป
      if (mo > 12) { mo = 1; y++; } if (mo < 1) { mo = 12; y--; }
    }
    const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCDate() !== d) return null;
    return `${y}-${pad(mo)}-${pad(d)}T${time}:00+07:00`;
  }

  function parse(sheets, planDate) {
    const result = { rows: [], sheets: [], dupInFile: 0, noEtd: 0 };
    const byHawb = new Map();
    let use = sheets.filter(s => sheetTag(s.name));
    if (!use.length) use = sheets;
    for (const sh of use) {
      const info = { name: sh.name, tag: sheetTag(sh.name), count: 0, missing: [], headerRow: -1, notes: 0 };
      result.sheets.push(info);
      const rows = sh.rows;
      for (let r = 0; r < Math.min(rows.length, 40); r++) {
        if ((rows[r] || []).some(c => /^HAWB/.test(H(c)))) { info.headerRow = r; break; }
      }
      if (info.headerRow < 0) { info.missing = ['HAWB']; continue; }
      const col = {};
      (rows[info.headerRow] || []).forEach((c, i) => {
        const h = H(c);
        if (!h) return;
        for (const [k, test] of COLS) if (col[k] === undefined && test(h)) { col[k] = i; break; }
      });
      info.missing = REQUIRED.filter(k => col[k] === undefined).map(k => k.toUpperCase());
      if (info.missing.length) continue;
      const g = (row, k) => col[k] === undefined ? null : row[col[k]];
      let carry = {};
      for (let r = info.headerRow + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        let id = hawbId(g(row, 'hawb'));
        if (!id) { carry = {}; continue; }
        const notes = [];
        const mRaw = g(row, 'mawb'), mVal = mawbOf(mRaw);
        if (mVal) carry.mawb = mVal; else if (str(mRaw)) notes.push(str(mRaw));
        const fRaw = g(row, 'flight'), fVal = flightOf(fRaw);
        if (fVal) carry.flight = fVal; else if (str(fRaw)) notes.push(str(fRaw));
        const t = timeOf(g(row, 'etd')); if (t) carry.etd = t;
        for (const k of ['customer', 'dest', 'cutoff', 'booking']) { const v = str(g(row, k)); if (v) carry[k] = v; }
        const mawb = mVal || carry.mawb || '';
        const flight = fVal || carry.flight || '';
        if (id === 'DIRECT') { if (!mawb) continue; id = 'DIRECT ' + mawb; }
        const puD = str(g(row, 'pu_date')).replace(/^'/, ''), puT = timeOf(g(row, 'pu_time'));
        info.notes += notes.length;
        const remark = [...notes, str(g(row, 'remark')), str(g(row, 'ob'))].filter(Boolean).join(' · ');
        const etd = etdIso(flight, carry.etd || null, planDate);
        const rec = {
          hawb: id, mawb, flight,
          customer: carry.customer || '',
          pcs: num(g(row, 'pcs')),
          gross_weight: num(g(row, 'gw')),
          volume_weight: num(g(row, 'vw')),
          cbm: num(g(row, 'cbm')),
          destination: (carry.dest || '').toUpperCase(),
          etd,
          source_sheet: info.tag,
          pickup: [puD, puT].filter(Boolean).join(' '),
          cut_off: carry.cutoff || '',
          priority: str(g(row, 'priority')),
          booking: carry.booking || '',
          remark,
          plan_date: planDate || null
        };
        if (!etd) result.noEtd++;
        if (byHawb.has(id)) { result.dupInFile++; result.rows[byHawb.get(id)] = rec; }
        else { byHawb.set(id, result.rows.length); result.rows.push(rec); }
        info.count++;
      }
    }
    return result;
  }
  return { parse, dateFromFileName, hawbId };
})();

async function loadProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { S.profile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) throw error;
  S.profile = data;
}

async function boot() {
  loadBrand().then(ch => { if (ch) { if (document.getElementById('page')) { renderShell(); } else if (document.getElementById('lf')) renderLogin(); } });
  const { data: { session } } = await sb.auth.getSession();
  S.session = session;
  if (!session) return renderLogin();
  try { await loadProfile(); } catch (e) { toast(thError(e), true); }
  if (!S.profile) return renderLogin('ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่');
  if (!S.profile.active) return renderPending();
  renderShell();
}

      if (error) { busy(btn, false); return fail(thError(error)); }

/* ---------- realtime: refresh when anyone changes data ---------- */
function startLive() {
  stopLive();
  let t;
  const kick = payload => {
    const n = (payload && (payload.new || payload.old)) || {};
    const sid = n.shipment_id || n.id;
    if (S.openId && sid === S.openId) {
      clearTimeout(S.dTimer);
      S.dTimer = setTimeout(() => { const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#drawer'))) loadDrawer(); }, 600);
    }
    clearTimeout(t);
    t = setTimeout(() => {
      refreshBell();
      if (S.page === 'dashboard') loadDashboard();
      else if ((S.page === 'board' || S.page === 'assign') && !S.openId) loadBoard();
      else if (S.page === 'board' || S.page === 'assign') S.boardStale = true;
      else if (S.page === 'trucks') loadTrucks();
    }, 900);
  };
  S.channel = sb.channel('nst-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'shipments' }, kick)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trucks' }, kick)
    .subscribe();
}
function stopLive() { if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } clearInterval(S.bellTimer); }

/* =====================================================================
   NOTIFICATIONS (bell)
   ===================================================================== */
const lastReadKey = () => 'nst_lastread_' + (S.profile ? S.profile.id : '');
const lastRead = () => { try { return localStorage.getItem(lastReadKey()) || '1970-01-01T00:00:00Z'; } catch (e) { return '1970-01-01T00:00:00Z'; } };
async function refreshBell() {
  if (!S.profile) return;
  const [h, u] = await Promise.all([
    sb.from('history').select('*').or('action.in.(IMPORT,DELETE,PURGE),and(action.eq.STATUS,to_value.eq.ISSUE)').order('changed_at', { ascending: false }).limit(40),
    sb.from('shipments').select('id', { count: 'exact', head: true }).eq('warehouse', 'UNASSIGNED')
  ]);
  if (!h.error) S.notifs = h.data || [];
  if (!u.error) S.unassigned = u.count || 0;
  paintBell();
}
function paintBell() {
  const lr = lastRead();
  const n = S.notifs.filter(x => x.changed_at > lr && x.changed_by !== (S.profile || {}).email).length;
  document.querySelectorAll('.bellc').forEach(b => { b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); });
  const nu = document.getElementById('navun');

function notifLine(h, unread) {
  const d = h.details || {};

  else if (h.action === 'IMPORT') { icon = 'upload'; c = 'var(--green)'; bg = 'var(--green-soft)'; txt = `นำเข้าแพลน${d.plan_round ? 'รอบ' + esc(d.plan_round) : ''} เสร็จ · ใหม่ ${num(d.new)} · อัปเดต ${num(d.updated)}`; }
  else if (h.action === 'DELETE') { icon = 'trash'; c = 'var(--red)'; bg = 'var(--red-soft)'; txt = `ลบข้อมูล ${num(d.shipments)} HAWB${d.file ? ' (ไฟล์ ' + esc(d.file) + ')' : ''}`; }
  else if (h.action === 'PURGE') { icon = 'trash'; c = 'var(--slate)'; bg = 'var(--slate-soft)'; txt = `ล้างข้อมูลเก่า ${num(d.shipments)} HAWB`; }
  else txt = esc(h.action);

    <span class="ni" style="--c:${c};--bgc:${bg}">${ico(icon, 20)}</span><div style="flex:1;min-width:0">${txt}<div class="small-muted">โดย ${esc((h.changed_by || '').split('@')[0])}</div></div>

function periodFilter(q) {
  if (S.period === 'today')    return q.gte('etd', bkkDay(0) + 'T00:00:00+07:00').lt('etd', bkkDay(1) + 'T00:00:00+07:00');
  if (S.period === 'tomorrow') return q.gte('etd', bkkDay(1) + 'T00:00:00+07:00').lt('etd', bkkDay(2) + 'T00:00:00+07:00');
  if (S.period === '7d')       return q.gte('etd', bkkDay(-6) + 'T00:00:00+07:00').lt('etd', bkkDay(1) + 'T00:00:00+07:00');
  return q;
}

  for (const w of whs) for (const s of sts)
    jobs.push(periodFilter(sb.from('shipments').select('id', { count: 'exact', head: true }).eq('warehouse', w).eq('status', s))
      .then(r => { if (r.error) throw r.error; return { w, s, n: r.count || 0 }; }));
  let rows;
  try { rows = await Promise.all(jobs); }
  catch (e) { const st = document.getElementById('stats'); if (st) st.innerHTML = `<div class="err" style="grid-column:1/-1">โหลดข้อมูลไม่ได้: ${esc(thError(e))}</div>`; return; }

function trendSvg(data) {
  const W = 640, H = 230, L = 40, B = 34, T = 14, R = 10;
  const series = [['departed', 'Departed', '#1e7be0'], ['loading', 'Loading', '#f0a12b'], ['issue', 'Issue', '#e0383e']];
  const max = Math.max(4, ...data.flatMap(d => series.map(s => +d[s[0]] || 0)));
  const step = Math.ceil(max / 4), top = step * 4;
  const cw = (W - L - R) / Math.max(1, data.length), bw = Math.min(16, (cw - 14) / 3);
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3ecf7"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#7a8aa0">${v}</text>`; }
  data.forEach((d, i) => {
    const x0 = L + cw * i + (cw - bw * 3 - 4) / 2;
    series.forEach((s, k) => { const v = +d[s[0]] || 0; if (v) g += `<rect x="${x0 + k * (bw + 2)}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="3" fill="${s[2]}"><title>${s[1]}: ${v}</title></rect>`; });
    const lbl = new Date(d.day + 'T12:00:00+07:00').toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric' });
    g += `<text x="${L + cw * i + cw / 2}" y="${H - 12}" text-anchor="middle" font-size="12" fill="#5f6f86">${lbl}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟ 7 วัน">${g}</svg>
    <div class="legend">${series.map(s => `<span style="--c:${s[2]}">${s[1]}</span>`).join('')}</div>`;
}

function imageToDataUrl(file, maxSide, photo) {
  return new Promise((resolve, reject) => {
    if (file.size > 8e6) return reject(new Error('ไฟล์ใหญ่เกิน 8 MB'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
    fr.onload = () => {
      if (file.type === 'image/svg+xml') return fr.result.length < 1.1e6 ? resolve(fr.result) : reject(new Error('ไฟล์ SVG ใหญ่เกินไป'));
      const img = new Image();
      img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let url = photo ? c.toDataURL('image/jpeg', 0.86) : c.toDataURL('image/png');
        if (url.length > 1.5e6) url = c.toDataURL('image/webp', 0.85);
        if (url.length > 1.5e6) url = c.toDataURL('image/jpeg', 0.75);
        url.length > 1.5e6 ? reject(new Error('ภาพใหญ่เกินไป ลองใช้ภาพที่เล็กลง')) : resolve(url);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function fetchAll(build, max = 5000) {
  const out = [];
  for (let from = 0; from < max; from += 1000) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function loadBoard() {
  const box = document.getElementById('blist');
  if (!box) return;
  S.boardStale = false;
  const f = S.bf, q = cleanQ(f.q);
  const build = (cols = 'id,hawb,mawb,flight,customer,destination,pcs,pcs_loaded,warehouse,status,current_holder,etd,source_sheet,truck_count,remark,ticket_status') => {
    let x = sb.from('shipment_view').select(cols);
    if (q) {
      const plain = q.replace(/\s+/g, '*');
      const alnum = q.replace(/[^0-9A-Za-z]/g, '');
      const fuzzy = alnum.length >= 4 ? alnum.split('').join('*') : plain;
      if (f.field === 'flight') x = x.ilike('flight', `%${plain.replace(/\*/g, '%')}%`);
      else if (f.field === 'mawb') x = x.ilike('mawb', `%${fuzzy.replace(/\*/g, '%')}%`);
      else if (f.field === 'hawb') x = x.ilike('hawb', `%${fuzzy.replace(/\*/g, '%')}%`);
      else x = x.or(`hawb.ilike.*${fuzzy}*,mawb.ilike.*${fuzzy}*,flight.ilike.*${plain}*,customer.ilike.*${plain}*,destination.ilike.*${plain}*`);
    } else if (f.scope === 'open') x = x.neq('status', 'DEPARTED');
    else if (f.scope === 'today') x = x.gte('etd', bkkDay(0) + 'T00:00:00+07:00').lt('etd', bkkDay(1) + 'T00:00:00+07:00');
    else if (f.scope === 'tomorrow') x = x.gte('etd', bkkDay(1) + 'T00:00:00+07:00').lt('etd', bkkDay(2) + 'T00:00:00+07:00');
    if (f.wh === 'MINE') x = x.eq('warehouse', myWh() || '-');
    else if (f.wh !== 'ALL') x = x.eq('warehouse', f.wh);
    if (f.st !== 'ALL') x = x.eq('status', f.st);
    if (f.sheet !== 'ALL') x = x.eq('source_sheet', f.sheet);
    if (f.tk !== 'ALL') x = x.eq('ticket_status', f.tk);
    return x.order('etd', { ascending: true, nullsFirst: false }).order('flight').order('mawb').order('hawb');
  };
  S.boardBuild = build;
  try { S.rows = await fetchAll(() => build()); }
  catch (e) { box.innerHTML = `<div class="err">โหลดข้อมูลไม่ได้: ${esc(thError(e))}</div>`; return; }
  const ids = new Set(S.rows.map(r => r.id));
  [...S.sel].forEach(id => { if (!ids.has(id)) S.sel.delete(id); });
  renderBoard();
}

function renderBoard() {
  const box = document.getElementById('blist');
  if (!box) return;
  const rows = S.rows;
  if (!rows.length) {
    box.innerHTML = `<div class="card empty-big"><h2>${S.bf.q ? 'ไม่พบรายการที่ค้นหา' : 'ไม่มีงานตามเงื่อนไขนี้'}</h2>
      <p>${S.bf.q ? 'ลองพิมพ์เฉพาะตัวเลขท้าย HAWB หรือ MAWB · ถ้า HAWB นี้ไม่อยู่ในแพลน กดเพิ่มเองได้' : 'ลองเลือก "ทั้งหมด" หรือนำเข้าแพลน Excel ก่อน'}</p>
      <div class="row-btns" style="justify-content:center">${S.bf.q && canAssign() ? '<button class="btn btn-primary" id="emptyadd">+ เพิ่ม HAWB นี้ (นอกแพลน)</button>' : ''}${canEdit() ? '<a class="btn btn-ghost" href="#import">นำเข้าแพลน Excel</a>' : ''}</div></div>`;
    const ea = box.querySelector('#emptyadd');
    if (ea) ea.onclick = () => manualDialog(S.bf.q);
    renderActbar(); return;
  }
  const fl = new Map();
  for (const s of rows) {
    const fk = s.flight || '(ไม่ระบุ FLIGHT)';
    if (!fl.has(fk)) fl.set(fk, new Map());
    const mm = fl.get(fk), mk = s.mawb || '(ไม่ระบุ MAWB)';
    if (!mm.has(mk)) mm.set(mk, []);
    mm.get(mk).push(s);
  }
  const sel = canSelect();
  const allOn = sel && rows.every(r => S.sel.has(r.id));
  let h = `<div class="muted-line">${sel ? `<label style="display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--navy);cursor:pointer"><input type="checkbox" class="cbx" data-selall="1" ${allOn ? 'checked' : ''}> เลือกทั้งหมด</label> ·` : ''}
    พบ <b>${num(rows.length)}</b> HAWB ใน <b>${num(fl.size)}</b> เที่ยวบิน${rows.length >= 5000 ? ' (แสดง 5,000 รายการแรก กรุณากรองเพิ่ม)' : ''}</div>`;
  for (const [fk, mm] of fl) {
    const items = [...mm.values()].flat();
    const tp = items.reduce((a, s) => a + (s.pcs || 0), 0), tl = items.reduce((a, s) => a + (s.pcs_loaded || 0), 0);
    const etd = items.find(s => s.etd)?.etd;
    const dest = [...new Set(items.map(s => s.destination).filter(Boolean))].join(', ');
    h += `<section class="card flight"><div class="fhead"><span class="ftag">FLIGHT</span><span class="fcode">${esc(fk)}</span>
      ${etd ? `<span class="fetd">ETD ${fmtEtd(etd)}</span>` : ''}${dest ? `<span class="fdest">→ ${esc(dest)}</span>` : ''}
      <span class="fmeta">${mm.size} MAWB · ${items.length} HAWB · โหลด ${num(tl)}/${num(tp)} PCS</span></div>`;
    for (const [mk, list] of mm) {
      const allSel = list.every(s => S.sel.has(s.id));
      h += `<div class="mawb"><div class="mhead">${sel ? `<input type="checkbox" class="cbx" data-selm="${list.map(s => s.id).join(',')}" ${allSel ? 'checked' : ''} aria-label="เลือกทั้ง MAWB">` : ''}
        <span class="ftag">MAWB</span><span class="mcode">${esc(mk)}</span><span class="fmeta">${list.length} HAWB</span></div>`;
      for (const s of list) {
        const pct = s.pcs ? Math.min(100, (s.pcs_loaded || 0) / s.pcs * 100) : 0;
        h += `<div class="hrow ${S.sel.has(s.id) ? 'sel' : ''}" data-open="${s.id}">
          ${sel ? `<input type="checkbox" class="cbx" data-sel="${s.id}" ${S.sel.has(s.id) ? 'checked' : ''} aria-label="เลือก ${esc(s.hawb)}">` : '<span></span>'}
          <div class="h-main"><div class="hawb">${esc(s.hawb)}${s.source_sheet === 'MANUAL' ? ' <span class="badge tag-man">เพิ่มเอง</span>' : ''}</div><div class="cust">${esc(s.customer || '-')}${s.current_holder ? ' · อยู่กับ <b>' + esc(s.current_holder) + '</b>' : ''}</div></div>
          <div class="h-dest"><span class="k">DEST</span>${esc(s.destination || '-')}</div>
          <div class="h-pcs"><span class="k">PCS โหลดแล้ว</span>${num(s.pcs_loaded || 0)} / ${num(s.pcs || 0)}<div class="mbar"><i style="width:${pct}%"></i></div></div>
          <div class="h-wh">${whBadge(s.warehouse)}</div>
          <div class="h-st">${stBadge(s.status)}${tkBadge(s)}</div>
        </div>`;
      }
      h += `</div>`;
    }
    h += `</section>`;
  }
  box.innerHTML = h;
  renderActbar();
}

function boardClick(e) {
  if (e.target.closest('input')) return;
  const r = e.target.closest('[data-open]');
  if (r) openDrawer(+r.dataset.open);
}
function boardChange(e) {
  const t = e.target;
  if (t.dataset.sel) { t.checked ? S.sel.add(+t.dataset.sel) : S.sel.delete(+t.dataset.sel); t.closest('.hrow').classList.toggle('sel', t.checked); }
  else if (t.dataset.selall) { S.rows.forEach(r => t.checked ? S.sel.add(r.id) : S.sel.delete(r.id)); renderBoard(); return; }
  else if (t.dataset.selm) { t.dataset.selm.split(',').forEach(id => t.checked ? S.sel.add(+id) : S.sel.delete(+id)); renderBoard(); return; }
  const m = t.closest('.mawb');
  if (m) { const all = [...m.querySelectorAll('[data-sel]')].every(c => c.checked); const mc = m.querySelector('[data-selm]'); if (mc) mc.checked = all; }
  renderActbar();
}

function renderActbar() {
  const bar = document.getElementById('actbar');
  if (!bar) return;
  if (!S.sel.size || !canSelect()) { bar.innerHTML = ''; return; }
  const wh = myWh();
  let btns = '';
  if (canAssign()) {
    btns += `<button class="btn btn-primary bulk" data-a="truck">${ico('truck', 18)} บันทึกรถคันเดียวกัน</button><button class="btn bulk" data-a="status">เปลี่ยนสถานะทีเดียว</button>`;
    btns += isAdmin()
      ? `<button class="btn to-DAC" data-to="DAC">กำหนดเป็น DAC</button><button class="btn to-BLC" data-to="BLC">กำหนดเป็น BLC</button>`
      : `<button class="btn to-${wh}" data-to="${wh}">รับเป็นงาน ${wh}</button>`;
    btns += `<button class="btn to-UN" data-to="UNASSIGNED">คืนเป็น UNASSIGNED</button>`;
  }
  if (canTicket()) btns += `<button class="btn tk-on" data-a="tk1">✓ ออกตั๋วแล้ว</button><button class="btn tk-off" data-a="tk0">ยังไม่ออกตั๋ว</button>`;
  if (isAdmin()) btns += `<button class="btn btn-danger" data-del="1">${ico('trash', 18)} ลบที่เลือก</button>`;
  bar.innerHTML = `<div class="actbar"><span class="cnt">เลือกแล้ว ${num(S.sel.size)} HAWB</span>${btns}<button class="btn btn-ghost" data-x="1">ยกเลิก</button></div>`;
  bar.querySelectorAll('button').forEach(b => b.onclick = () => {
    const ids = [...S.sel];
    if (b.dataset.x) { S.sel.clear(); renderBoard(); }
    else if (b.dataset.del) deleteSelected(ids, b);
    else if (b.dataset.to !== undefined) doAssign(ids, b.dataset.to, b);
    else if (b.dataset.a === 'truck') bulkTruckDialog(ids);
    else if (b.dataset.a === 'status') bulkStatusDialog(ids);
    else if (b.dataset.a === 'tk1') ticketDialog(ids, true);
    else if (b.dataset.a === 'tk0') ticketDialog(ids, false);
  });
}

/* ---------- ทำหลาย HAWB ทีเดียว ---------- */
function formModal(title, html, okText, onOk) {
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="card modal"><h3>${esc(title)}</h3><div class="modal-body">${html}</div><div class="ferr"></div><div class="row-btns">
    <button class="btn btn-ghost" data-r="0">ยกเลิก</button><button class="btn btn-primary" data-r="1">${esc(okText)}</button></div></div>`;
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m || (e.target.closest('[data-r]') && e.target.closest('[data-r]').dataset.r === '0')) close(); };
  const ok = m.querySelector('[data-r="1"]');
  ok.onclick = async () => {
    m.querySelector('.ferr').innerHTML = '';
    busy(ok, true, 'กำลังบันทึก...');
    let err = null;
    try { err = await onOk(m.querySelector('.modal'), close); } catch (e) { err = thError(e); }
    if (document.body.contains(m)) busy(ok, false);
    if (err) m.querySelector('.ferr').innerHTML = `<div class="err" style="margin:12px 0 0">${esc(err)}</div>`;
  };
  document.body.appendChild(m);
  const f = m.querySelector('input,select,textarea');
  if (f) setTimeout(() => f.focus(), 50);
  return m;
}
function selInfo(ids) {
  const set = new Set(ids), rows = S.rows.filter(r => set.has(r.id));
  const mine = rows.filter(canEditShip);
  const rem = mine.reduce((a, r) => a + Math.max(0, (r.pcs || 0) - (r.pcs_loaded || 0)), 0);
  const mawbs = [...new Set(rows.map(r => r.mawb).filter(Boolean))];
  return { rows, mine, rem, mawbs, other: rows.length - mine.length };
}
function skippedHtml(sk) {
  return sk.length ? `<p style="margin-top:14px"><b>ข้าม ${sk.length} รายการ</b></p><ul class="list">${sk.map(x => `<li><b>${esc(x.hawb)}</b><span style="margin-left:auto;color:var(--muted);text-align:right">${esc(x.reason)}</span></li>`).join('')}</ul>` : '';
}
function afterBulk() {
  S.sel.clear();
  if (S.openId) loadDrawer();
  if (document.getElementById('blist')) loadBoard();
}

    ${i.other ? `<div class="note-box" style="margin-bottom:12px">มี ${i.other} HAWB ที่เป็นของคลังอื่นหรือยังไม่จัดคลัง ระบบจะข้ามให้</div>` : ''}
    <div class="grid-2"><label class="field"><span>ทะเบียนรถ *</span><input class="inp" id="bplate" placeholder="เช่น 70-1234"></label>
    <label class="field"><span>ชื่อคนขับ</span><input class="inp" id="bdriver"></label></div>

  const m = formModal('บันทึกรถคันเดียว ให้หลาย HAWB', html, 'บันทึกรถ', async (box, close) => {

function bulkStatusDialog(ids) {

    <div class="stbtns" id="bst">${Object.entries(STATUS).map(([k, v]) => `<button type="button" class="stbtn s-${k}" data-st="${k}">${k}<small>${v.th}</small></button>`).join('')}</div>

    close();

    toast(`เปลี่ยนเป็น ${pick} แล้ว ${data.ok} HAWB${sk.length ? ' · ข้าม ' + sk.length : ''}`, !data.ok);
